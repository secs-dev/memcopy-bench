name: Bazel

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        # MODULE.bazel and .bazelversion live in src/
        working-directory: src

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # Pull requests only restore caches, pushes to main refresh them
          cache-save: ${{ github.event_name == 'push' }}
          bazelrc: |
            common --announce_rc
            common --color=yes

      - name: Bazel version
        run: bazel version

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --test_output=errors
